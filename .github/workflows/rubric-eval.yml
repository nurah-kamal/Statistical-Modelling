name: rubric-eval

on:
  push:
    branches: [main]
    paths: ['rubric-eval/**', '.github/workflows/rubric-eval.yml']
  pull_request:
    branches: [main]
    paths: ['rubric-eval/**', '.github/workflows/rubric-eval.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rubric-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - name: The published figures still come out of the recording
        run: |
          npm run eval -- --client recorded --model gemini-3.5-flash-lite --label gemini-3.5-flash-lite
          npm run eval -- --client stub
          git diff --exit-code -- results/
