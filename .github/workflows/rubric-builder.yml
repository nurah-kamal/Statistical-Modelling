name: rubric-builder

on:
  push:
    branches: [main]
    paths:
      - 'rubric-builder/**'
      - 'rubric-eval/rubrics/**'
      - 'rubric-eval/src/rubric.js'
      - '.github/workflows/rubric-builder.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rubric-builder/**'
      - 'rubric-eval/rubrics/**'
      - 'rubric-eval/src/rubric.js'
      - '.github/workflows/rubric-builder.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rubric-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The round-trip test loads rubric-eval's own validator, so it needs rubric-eval's packages too.
      - run: npm ci
        working-directory: rubric-eval
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
